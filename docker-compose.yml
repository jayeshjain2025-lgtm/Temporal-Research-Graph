services:
  postgres:
    image: postgres:16
    container_name: temporal_research_kg_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: research_kg
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d research_kg"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

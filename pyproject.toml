[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-research-kg"
version = "0.1.0"
description = "Phase 1 temporal knowledge graph for research intelligence."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: requires PostgreSQL configured by TEST_DATABASE_URL"
]
